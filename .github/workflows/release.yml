name: Release builds (Windows + Web)

# Builds the one-click Windows exe (pck embedded) and the web build, and
# attaches both zips to a GitHub Release when a v* tag is pushed. Run it by
# hand (Actions > Release builds > Run workflow) to get them as artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          bash tools/setup_godot.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Export
        run: bash tools/export.sh --templates
      - name: Package
        run: |
          mkdir -p dist
          cp docs/README_PLAYERS.txt "build/windows/はじめにお読みください.txt"
          (cd build/windows && zip -q -9 ../../dist/Rainpans-windows.zip Rainpans.exe "はじめにお読みください.txt")
          (cd build/web && zip -q -9 -r ../../dist/Rainpans-web.zip . -x "*.import")
      - uses: actions/upload-artifact@v4
        with:
          name: Rainpans
          path: dist/*.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
