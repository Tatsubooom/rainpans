name: Web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and web templates
        run: |
          bash tools/setup_godot.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Export web build
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          TPL="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TPL" build/web
          curl -sSL --retry 4 -o /tmp/t.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -oqj /tmp/t.tpz templates/version.txt templates/web_nothreads_release.zip -d "$TPL"
          godot --headless --import || true
          godot --headless --export-release "Web" build/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
